# See: https://docs.github.com/en/actions/reference/workflow-syntax-for-github-actions

name: 'Test: MkDocs build (strict)'

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - new
    paths:
      - '.github/workflows/test_mkdocs-build.yml'
      - 'config/**'
      - 'docs/**'
      - 'overrides/**'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang: [en, fr, nl]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Build ${{ matrix.lang }} (broken links, anchors and nav fail the build)
        working-directory: config/${{ matrix.lang }}
        run: uv run mkdocs build --strict --site-dir "$RUNNER_TEMP/site"
